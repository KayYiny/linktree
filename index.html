<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noarchive, nofollow">
    <title>Loading…</title>
    <!-- Favicon：由 data-loader 按数据库 site.favicon 动态设置 -->
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css">
    <!-- Core theme CSS -->
    <link rel="stylesheet" href="/style.css">
    <!-- 页面背景：data-loader 会从数据库按页面覆盖 --bg-image -->
    <style>
      body {
        background: var(--bg) center/cover fixed no-repeat;
      }
    </style>
    <!-- 非关键脚本（defer，并行下载不阻塞渲染） -->
    <script defer src="/assets/scripts/i18n.js"></script>
    <script defer src="/assets/scripts/gallery.js"></script>
    <script defer src="/assets/scripts/pet.js"></script>
    <script defer src="/assets/scripts/easter-egg.js"></script>
    <script defer src="/assets/scripts/qrcode-popup.js"></script>
    <!-- 密钥生成（耳语页访问控制） -->
    <script defer src="/assets/scripts/keygen.js"></script>
    <!-- 数据加载器：从数据库 API 获取配置并渲染（单一模板，按 URL 识别页面 slug） -->
    <script defer src="/data-loader.js"></script>
    <!-- 主页密钥入口提示弹窗（仅主页生效） -->
    <script defer src="/assets/scripts/hint-popup.js"></script>
  </head>

  <body>
    <!-- 新粗野主义装饰角标 -->
    <div class="brutal-corner-tl"></div>
    <div class="brutal-corner-tr"></div>
    <div class="brutal-corner-bl"></div>
    <div class="brutal-corner-br"></div>

    <!-- 主容器 -->
    <main class="container">

      <!-- 顶部装饰条 -->
      <div class="brutal-bar"></div>

      <div id="profilePicture">
        <!-- data-loader 动态渲染 -->
      </div>

      <div id="userName">
        <!-- data-loader 动态渲染 -->
      </div>

      <!-- 粗野主义分隔符 -->
      <div class="brutal-divider">
        <span>///</span>
      </div>

      <!-- 语言切换 -->
      <div class="toolbar-row">
        <button id="langSwitch" class="lang-switch-btn" onclick="setLanguage(getLang() === 'zh-CN' ? 'en' : 'zh-CN')">EN</button>
        <a class="album-btn gallery-trigger" href="javascript:void(0)">
          <i class="fas fa-images"></i>
          <span data-i18n="album.label">Album</span>
        </a>
        <button class="album-btn" id="shareBtn">
          <i class="fas fa-share-alt"></i>
          <span data-i18n="share.button">分享入口</span>
        </button>
      </div>

      <div id="links">
        <!-- data-loader 动态渲染 -->
      </div>

      <!-- ========== 虚拟宠物 ========== -->
      <div id="pet">
        <div class="pet-bubble" id="petBubble"></div>
        <!-- data-loader 动态渲染 -->
      </div>

      <div id="hashtag">
        &copy;
      </div>

      <div id="poweredBy">Powered by HuoLin</div>

    </main>

    <!-- Anti-Inspect 防护（需尽早生效） -->
    <script src="/assets/scripts/anti-inspect.js"></script>

    <!-- 合并配置与交互逻辑（不含个性化数据；data-loader 会从数据库覆盖） -->
    <script>
    (function() {
      'use strict';

      // ---- 相册图片（data-loader 会覆盖） ----
      window.__galleryImages = window.__galleryImages || [];

    })();

    // ---- 分享当前页面链接（耳语页自动带当前有效密钥 ?k=，其他页分享首页） ----
    (function() {
      var btn = document.getElementById('shareBtn');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var path = window.location.pathname || '/';
        var slug = path.replace(/^\/+|\/+$/g, '').split('/')[0] || 'main';
        var url;
        if (slug === 'whisper') {
          var cfg = (window.__dbConfig && window.__dbConfig.site) || null;
          var k = '';
          if (cfg && cfg.key_enabled !== '0' && window.__keygen) {
            k = window.__keygen.currentKey(cfg.key_rotation || 'daily', cfg.key_salt || '');
          }
          url = window.location.origin + window.location.pathname + (k ? '?k=' + k : '');
        } else {
          url = window.location.origin + '/';
        }
        if (navigator.clipboard) navigator.clipboard.writeText(url);
        var check = (window.getLang && window.getLang() === 'en') ? 'Copied!' : '已复制';
        var orig = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check"></i> <span>' + check + '</span>';
        setTimeout(function () { btn.innerHTML = orig; }, 2000);
      });
    })();
    </script>

    <!-- 网站加载过渡弹窗（data-loader 连接数据库并渲染完成后自动隐藏） -->
    <div id="siteLoading" class="site-loading">
      <div class="site-loading-card">
        <span class="sl-corner sl-corner-tl"></span>
        <span class="sl-corner sl-corner-tr"></span>
        <span class="sl-corner sl-corner-bl"></span>
        <span class="sl-corner sl-corner-br"></span>
        <div class="sl-title">LOADING<span class="sl-dot">.</span><span class="sl-dot">.</span><span class="sl-dot">.</span></div>
        <div class="sl-bars" aria-hidden="true">
          <span class="sl-bar"></span>
          <span class="sl-bar"></span>
          <span class="sl-bar"></span>
          <span class="sl-bar"></span>
        </div>
        <div class="sl-status" id="siteLoadingStatus">正在连接数据库…</div>
      </div>
    </div>
    <script>
    (function () {
      var texts = ['正在连接数据库…', '正在加载头像…', '正在铺开链接…', '再等一下下…', '即将完成…'];
      var i = 0;
      var el = document.getElementById('siteLoadingStatus');
      if (!el) return;
      setInterval(function () {
        i = (i + 1) % texts.length;
        el.textContent = texts[i];
      }, 900);
    })();
    </script>
  </body>
</html>
