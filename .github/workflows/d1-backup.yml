# 每月 1 日自动导出 D1 全库 SQL 备份到仓库 backups/ 目录
# 需在仓库 Settings → Secrets 配置：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
# （API Token 权限：Account D1 Edit）
name: d1-backup

on:
  schedule:
    - cron: '0 2 1 * *' # 每月 1 日 02:00 UTC
  workflow_dispatch: {} # 也可手动触发

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 wrangler
        run: npm install -g wrangler

      - name: 导出 D1 数据库
        run: |
          mkdir -p backups
          npx wrangler d1 export linktree --remote --output=backups/linktree-$(date +%Y%m%d).sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 提交备份
        run: |
          git config user.name "d1-backup-bot"
          git config user.email "actions@github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "chore: 每月 D1 备份 $(date +%Y-%m-%d)"
          git push
