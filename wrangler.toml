name = "linktree"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# 静态资源（public/）优先命中；未命中的路径（/api/*、页面 slug 如 /whisper）落到 Worker
# binding 必须配置：兜底路由要用 env.ASSETS 取 index.html 渲染页面 slug
[assets]
directory = "public"
binding = "ASSETS"

# D1 数据库（`wrangler d1 create linktree` 后把返回的 database_id 填入下方）
[[d1_databases]]
binding = "DB"
database_name = "linktree"
database_id = "cca07e81-9caf-4b1a-9088-9780cd525ebe"

# R2 图片/视频存储（免费 10GB·月，账号级共享）
[[r2_buckets]]
binding = "FILES"
bucket_name = "linktree-assets"

# 自定义域名（也可在 Cloudflare Dashboard → Workers → Custom Domains 绑定）
# routes = [
#   { pattern = "example.com", custom_domain = true }
# ]
