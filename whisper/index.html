<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noarchive, nofollow">
    <title>火林 · 这是我的秘密 ✦</title>
    <!-- 密钥校验：无有效密钥则跳回首页（阻塞脚本，防止页面闪烁） -->
    <script>
    (function() {
      var SALT = 'hul_ref_2024';
      function _hash(s) { var h = 0; for (var i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; } return Math.abs(h).toString(36); }
      var d = new Date(), y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
      var secret = _hash(y+'-'+m+'-'+day+SALT).slice(0,6);
      var k = new URLSearchParams(location.search).get('k');
      if (k !== secret) { location.replace('../'); }
    })();
    </script>
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <!-- i18n 多语言（须在其他脚本之前加载） -->
    <script defer src="../assets/scripts/i18n.js"></script>
    <!-- 页面背景（data-loader 会覆盖） -->
    <style>
      body {
        --bg-image: url('../assets/images/Puppy_Play_Pride_Flag.svg');
        background: var(--bg) var(--bg-image) center/cover fixed no-repeat;
      }
    </style>
    <!-- 资源提示 -->
    <link rel="preconnect" href="https://pan.puppyis.cool">
    <!-- 非关键脚本（defer，并行下载不阻塞渲染） -->
    <script defer src="../assets/scripts/gallery.js"></script>
    <script defer src="../assets/scripts/pet.js"></script>
    <script defer src="../assets/scripts/easter-egg.js"></script>
    <!-- 数据加载器 -->
    <script defer src="../data-loader.js"></script>
  </head>

  <body>
    <!-- 新粗野主义装饰角标 -->
    <div class="brutal-corner-tl"></div>
    <div class="brutal-corner-tr"></div>
    <div class="brutal-corner-bl"></div>
    <div class="brutal-corner-br"></div>

    <main class="container">

      <!-- 顶部装饰条 -->
      <div class="brutal-bar"></div>

      <div id="profilePicture">
        <!-- data-loader 动态渲染 -->
      </div>

      <div id="userName">
        <!-- data-loader 动态渲染 -->
      </div>

      <!-- 粗野主义分隔符 -->
      <div class="brutal-divider">
        <span>///</span>
      </div>

      <!-- 语言切换 -->
      <div class="toolbar-row">
        <button id="langSwitch" class="lang-switch-btn" onclick="setLanguage(getLang() === 'zh-CN' ? 'en' : 'zh-CN')">EN</button>
        <a class="album-btn gallery-trigger" href="javascript:void(0)">
          <i class="fas fa-images"></i>
          <span data-i18n="album.label">Album</span>
        </a>
        <button class="album-btn" id="shareLinkBtn">
          <i class="fas fa-link"></i>
          <span data-i18n="share.button">分享入口</span>
        </button>
      </div>

      <div id="links">
        <!-- data-loader 动态渲染 -->
      </div>

      <!-- ========== 虚拟宠物 ========== -->
      <div id="pet">
        <div class="pet-bubble" id="petBubble"></div>
        <!-- data-loader 动态渲染 -->
      </div>

      <div id="hashtag">© 2026 HuoLin</div>

    </main>

    <!-- Anti-Inspect 防护（需尽早生效） -->
    <script src="../assets/scripts/anti-inspect.js"></script>

    <!-- 合并配置与交互逻辑 -->
    <script>
    (function() {
      'use strict';

      // ---- Easter Egg 配置 ----
      window.__eggConfig = {
        clicks: 5,
        action: function () {
          window.location.href = '../';
        }
      };

      // ---- 相册图片（data-loader 会覆盖） ----
      window.__galleryImages = window.__galleryImages || [];

    })();

    // ---- 分享入口：复制当日密钥链接 ----
    (function() {
      var btn = document.getElementById('shareLinkBtn');
      if (!btn) return;

      var SALT = 'hul_ref_2024';

      function _hash(s) {
        var h = 0;
        for (var i = 0; i < s.length; i++) {
          h = ((h << 5) - h) + s.charCodeAt(i);
          h |= 0;
        }
        return Math.abs(h).toString(36);
      }

      function getSecret() {
        var d = new Date();
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        return _hash(y + '-' + m + '-' + day + SALT).slice(0, 6);
      }

      btn.addEventListener('click', function () {
        var url = window.location.origin + '/?' + getSecret();
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url);
        }
        var check = (window.getLang && window.getLang() === 'en') ? 'Copied!' : '已复制';
        var orig = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check"></i> <span>' + check + '</span>';
        setTimeout(function () { btn.innerHTML = orig; }, 2000);
      });
    })();

    </script>
  </body>
</html>
