<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noarchive, nofollow">
    <title data-i18n="page.title.whisper">火林 · 这是我的秘密 ✦</title>
    <!-- 密钥校验：无有效密钥则跳回首页（校验期间隐藏正文，避免闪烁） -->
    <style>
      html.__whisper-check body { visibility: hidden; }
      html.__whisper-ok body { visibility: visible; }
    </style>
    <script>
    (function() {
      var SALT_DEFAULT = 'hul_ref_2024';
      var LEN_DEFAULT = 6;
      function _hash(s) { var h = 0; for (var i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; } return Math.abs(h).toString(36); }
      function getSecret(salt, len) {
        var d = new Date(), y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
        return _hash(y+'-'+m+'-'+day+salt).slice(0, len);
      }
      function pass(salt, len) {
        var k = new URLSearchParams(location.search).get('k');
        return !!k && k === getSecret(salt || SALT_DEFAULT, len || LEN_DEFAULT);
      }
      document.documentElement.classList.add('__whisper-check');
      function ok() {
        document.documentElement.classList.remove('__whisper-check');
        document.documentElement.classList.add('__whisper-ok');
      }
      // 先用默认盐快速判定（多数情况直接通过，无闪烁）
      if (pass(SALT_DEFAULT, LEN_DEFAULT)) { ok(); return; }
      // 默认盐不通过 → 拉取配置用配置盐再校验（盐/长度/开关均可后台改）
      fetch('/api/config', { headers: { Accept: 'application/json' } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (cfg) {
          var w = cfg && cfg.whisper;
          if (!w || w.enabled === false || !pass(w.salt, w.secretLen)) {
            location.replace('../');
          } else {
            ok();
          }
        })
        .catch(function () { location.replace('../'); });
    })();
    </script>
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <!-- i18n 多语言（须在其他脚本之前加载） -->
    <script defer src="../assets/scripts/i18n.js"></script>
    <!-- 页面背景 -->
    <style>
      body {
        --bg-image: url('../assets/images/Puppy_Play_Pride_Flag.svg');
        background: var(--bg) var(--bg-image) center/cover fixed no-repeat;
      }
    </style>
    <!-- 资源提示 -->
    <link rel="preconnect" href="https://pan.puppyis.cool">
    <!-- 非关键脚本（defer，并行下载不阻塞渲染） -->
    <script defer src="../assets/scripts/site-data.js"></script>
    <script defer src="../assets/scripts/secret.js"></script>
    <script defer src="../assets/scripts/gallery.js"></script>
    <script defer src="../assets/scripts/pet.js"></script>
    <script defer src="../assets/scripts/easter-egg.js"></script>
  </head>

  <body>
    <!-- 新粗野主义装饰角标 -->
    <div class="brutal-corner-tl"></div>
    <div class="brutal-corner-tr"></div>
    <div class="brutal-corner-bl"></div>
    <div class="brutal-corner-br"></div>

    <main class="container">

      <!-- 顶部装饰条 -->
      <div class="brutal-bar"></div>

      <div id="profilePicture">
        <img src="../assets/images/avatar.webp" alt="头像">
      </div>

      <div id="userName">HUOLIN</div>

      <!-- 粗野主义分隔符 -->
      <div class="brutal-divider">
        <span>///</span>
      </div>

      <!-- 语言切换 -->
      <div class="toolbar-row">
        <button id="langSwitch" class="lang-switch-btn" onclick="setLanguage(getLang() === 'zh-CN' ? 'en' : 'zh-CN')">EN</button>
        <a class="album-btn gallery-trigger" href="javascript:void(0)">
          <i class="fas fa-images"></i>
          <span data-i18n="album.label">Album</span>
        </a>
        <button class="album-btn" id="shareLinkBtn">
          <i class="fas fa-link"></i>
          <span data-i18n="share.button">分享入口</span>
        </button>
      </div>

      <div id="links">
        <!-- 链接由 assets/scripts/site-data.js 从 /api/config 动态渲染 -->
      </div>

      <!-- ========== 虚拟宠物 ========== -->
      <div id="pet">
        <div class="pet-bubble" id="petBubble"></div>
        <img src="../assets/pets/pet1.webp" alt="宠物" id="petImage">
      </div>

      <div id="hashtag">© 2026 HuoLin</div>

    </main>

    <!-- Anti-Inspect 防护（需尽早生效） -->
    <script src="../assets/scripts/anti-inspect.js"></script>

    <!-- 合并配置与交互逻辑 -->
    <script>
    (function() {
      'use strict';

      // ---- Easter Egg 配置（site-data.js 加载配置后会覆盖） ----
      window.__eggConfig = {
        clicks: 5,
        action: function () {
          window.location.href = '../';
        }
      };

      // ---- 宠物语录（由 i18n 按语言提供） ----
      window.__petMessagesKey = 'pet.dog';
      // 注：链接与相册由 site-data.js 从 /api/config 渲染

    })();

    // ---- 分享入口：复制当日密钥链接 ----
    (function() {
      var btn = document.getElementById('shareLinkBtn');
      if (!btn) return;

      // 当日密钥由 secret.js 提供（盐/长度可在后台配置）
      btn.addEventListener('click', function () {
        var url = window.location.origin + '/?' + window.__getDailySecret();
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url);
        }
        var check = (window.getLang && window.getLang() === 'en') ? 'Copied!' : '已复制';
        var orig = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check"></i> <span>' + check + '</span>';
        setTimeout(function () { btn.innerHTML = orig; }, 2000);
      });
    })();

    </script>
  </body>
</html>
