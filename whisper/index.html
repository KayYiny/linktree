    <script defer src="../assets/scripts/i18n.js"></script>

    <style>
      body {
        --bg-image: url('../assets/images/Puppy_Play_Pride_Flag.svg');

      }
    </style>
    <!-- 资源提示 -->
    <link rel="preconnect" href="https://pan.puppyis.cool">
    <!-- 非关键脚本（defer，并行下载不阻塞渲染） -->

    <script defer src="../assets/scripts/easter-egg.js"></script>

  <body>
    <!-- 新粗野主义装饰角标 -->
    <div class="brutal-corner-tl"></div>
    <div class="brutal-corner-tr"></div>
    <div class="brutal-corner-bl"></div>
    <div class="brutal-corner-br"></div>

    <main class="container">

      <!-- 顶部装饰条 -->
      <div class="brutal-bar"></div>

        <img src="../assets/images/avatar.webp" alt="头像">
      </div>

      <div id="userName">HUOLIN</div>

      <!-- 粗野主义分隔符 -->
      <div class="brutal-divider">
        <span>///</span>
      </div>

      <!-- 语言切换 -->
      <button id="langSwitch" class="lang-switch-btn" onclick="setLanguage(getLang() === 'zh-CN' ? 'en' : 'zh-CN')">EN</button>

      <div id="links">
        <!-- 相册（固定在第一位） -->
        <a class="link gallery-trigger" href="javascript:void(0)">
          <span class="link-icon"><i class="fas fa-images"></i></span>
          <span class="link-label" data-i18n="album.label">Album</span>
        </a>
        <!-- X（Twitter） -->
        <a class="link" href="https://x.com/PuppyHuoLin" target="_blank">
          <span class="link-icon"><img src="../assets/icons/x.svg" class="brand-icon" alt="X"></span>
          <span class="link-label" data-i18n="brand.x">X (Twitter)</span>
        </a>
        <!-- Instagram -->
        <a class="link" href="https://www.instagram.com/puppyhuolin" target="_blank">
          <span class="link-icon"><img src="../assets/icons/instagram.svg" class="brand-icon" alt="Instagram"></span>
          <span class="link-label" data-i18n="brand.instagram">Instagram</span>
        </a>
        <!-- Bluesky -->
        <a class="link" href="https://bsky.app/profile/slave.puppyhuolin.com" target="_blank">
          <span class="link-icon"><img src="../assets/icons/bluesky.svg" class="brand-icon" alt="Bluesky"></span>
          <span class="link-label" data-i18n="brand.bluesky">Bluesky</span>
        </a>
      </div>

      <!-- ========== 虚拟宠物 ========== -->
      <div id="pet">
        <div class="pet-bubble" id="petBubble"></div>
        <img src="../assets/pets/pet1.webp" alt="宠物" id="petImage">
      </div>

      <div id="hashtag">© 2026 HuoLin</div>

    </main>

    <!-- Anti-Inspect 防护（需尽早生效） -->
