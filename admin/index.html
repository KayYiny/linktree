<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理面板 — 登录</title>
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
  </head>
  <body class="dark-theme">
    <div class="login-container">
      <div class="login-card">
        <h1>🔧 HUOLIN·ADMIN</h1>
        <form id="loginForm">
          <div class="form-group">
            <label>用户名</label>
            <input type="text" id="username" name="username" required autocomplete="username">
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
          </div>
          <div id="loginError" class="error-msg" style="display:none"></div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem">登录</button>
        </form>
        <p style="margin-top:1.2rem;font-size:0.8rem"><a href="/" style="color:var(--text-dark);font-weight:700;text-decoration:none">← 返回主页</a></p>
      </div>
    </div>

    <script>
    (function() {
      if (localStorage.getItem('admin_token')) {
        window.location.href = '/admin/admin.html';
        return;
      }

      document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var username = document.getElementById('username').value;
        var password = document.getElementById('password').value;
        var errorEl = document.getElementById('loginError');
        errorEl.style.display = 'none';

        try {
          var res = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
          });
          var data = await res.json();

          if (res.ok && data.token) {
            localStorage.setItem('admin_token', data.token);
            localStorage.setItem('admin_username', data.username);
            window.location.href = '/admin/admin.html';
          } else {
            errorEl.textContent = data.error || '登录失败';
            errorEl.style.display = 'block';
          }
        } catch (err) {
          errorEl.textContent = '网络错误，请重试';
          errorEl.style.display = 'block';
        }
      });
    })();
    </script>
  </body>
</html>
