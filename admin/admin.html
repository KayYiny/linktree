<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理面板</title>
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
  </head>
  <body class="dark-theme">
    <div class="brutal-corner-tl"></div>
    <div class="brutal-corner-tr"></div>
    <div class="brutal-corner-bl"></div>
    <div class="brutal-corner-br"></div>

    <!-- 顶部栏 -->
    <header class="admin-header">
      <h1>HUOLIN·ADMIN</h1>
      <div class="header-actions">
        <a href="/" class="btn btn-outline"><i class="fas fa-arrow-left"></i> 返回主页</a>
        <button class="btn btn-outline" id="exportBtn"><i class="fas fa-download"></i> 导出</button>
        <button class="btn btn-outline" id="importBtn"><i class="fas fa-upload"></i> 导入</button>
        <button class="btn btn-primary" id="saveBtn"><i class="fas fa-save"></i> 保存</button>
      </div>
    </header>

    <!-- 标签页导航 -->
    <nav class="admin-tabs">
      <button class="tab active" data-tab="links"><i class="fas fa-link"></i> 链接管理</button>
      <button class="tab" data-tab="gallery"><i class="fas fa-images"></i> 相册管理</button>
      <button class="tab" data-tab="pet"><i class="fas fa-paw"></i> 宠物管理</button>
      <button class="tab" data-tab="translations"><i class="fas fa-language"></i> 翻译管理</button>
      <button class="tab" data-tab="settings"><i class="fas fa-cog"></i> 设置</button>
    </nav>

    <!-- 内容区 -->
    <main class="admin-content">

      <!-- ========== 链接管理 ========== -->
      <div id="panel-links" class="tab-panel active">
        <div class="panel-header">
          <h2>链接管理</h2>
          <select id="linkPageFilter">
            <option value="">全部页面</option>
          </select>
        </div>
        <button class="btn btn-primary" id="addLinkBtn" style="margin-bottom:1rem">
          <i class="fas fa-plus"></i> 新增链接
        </button>
        <div id="linksList"></div>
      </div>

      <!-- ========== 相册管理 ========== -->
      <div id="panel-gallery" class="tab-panel">
        <div class="panel-header">
          <h2>相册管理</h2>
          <select id="galleryPageFilter">
            <option value="">全部页面</option>
          </select>
        </div>
        <button class="btn btn-primary" id="addGalleryBtn" style="margin-bottom:1rem">
          <i class="fas fa-plus"></i> 新增图片
        </button>
        <div id="galleryList" class="gallery-grid"></div>
      </div>

      <!-- ========== 宠物管理 ========== -->
      <div id="panel-pet" class="tab-panel">
        <div class="panel-header">
          <h2>宠物管理</h2>
          <select id="petPageFilter">
            <option value="">全部页面</option>
          </select>
        </div>
        <button class="btn btn-primary" id="addPetBtn" style="margin-bottom:1rem">
          <i class="fas fa-plus"></i> 新增宠物
        </button>
        <div id="petList"></div>
      </div>

      <!-- ========== 翻译管理 ========== -->
      <div id="panel-translations" class="tab-panel">
        <div class="panel-header">
          <h2>翻译管理</h2>
          <input type="text" id="transSearch" placeholder="搜索 key..." style="max-width:300px">
        </div>
        <button class="btn btn-primary" id="addTransBtn" style="margin-bottom:1rem">
          <i class="fas fa-plus"></i> 新增翻译
        </button>
        <div id="transList"></div>
      </div>

      <!-- ========== 设置 ========== -->
      <div id="panel-settings" class="tab-panel">
        <h2>设置</h2>

        <!-- 站点配置 -->
        <div class="settings-section">
          <h3><i class="fas fa-globe"></i> 站点配置</h3>
          <form id="siteConfigForm">
            <div class="form-row">
              <div class="form-group">
                <label>头像 URL</label>
                <input type="text" name="avatar" placeholder="assets/images/avatar.webp">
              </div>
              <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" placeholder="HUOLIN">
              </div>
            </div>
            <div class="form-group">
              <label>Favicon URL</label>
              <input type="text" name="favicon" placeholder="assets/images/favicon.svg">
            </div>
          </form>
        </div>

        <!-- 修改密码 -->
        <div class="settings-section">
          <h3><i class="fas fa-lock"></i> 修改密码</h3>
          <form id="changePasswordForm">
            <div class="form-group">
              <label>当前密码</label>
              <input type="password" name="oldPassword" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>新密码</label>
                <input type="password" name="newPassword" required minlength="4">
              </div>
              <div class="form-group">
                <label>确认新密码</label>
                <input type="password" name="confirmPassword" required minlength="4">
              </div>
            </div>
          </form>
        </div>
      </div>

    </main>

    <!-- 消息提示 -->
    <div id="toast" class="toast" style="display:none"></div>

    <!-- 导入文件输入 -->
    <input type="file" id="importFileInput" accept=".json" style="display:none">

    <script src="admin.js"></script>
  </body>
</html>
